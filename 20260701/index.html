<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Counter | クリックカウンター</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="counter-container">
        <h1 class="counter-title">CLICK COUNTER</h1>
        <div id="counter-display" class="counter-number">0</div>
        
        <div class="button-group">
            <button id="increment-btn" class="btn btn-primary">+1</button>
            <button id="reset-btn" class="btn btn-secondary">リセット</button>
        </div>
    </div>

    <script src="script2.js"></script>
</body>
</html>
